<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Learning App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
            min-width: 120px;
        }

        .tab-btn:hover {
            background: #e9ecef;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            background: white;
        }

        .tab-content {
            display: none;
            padding: 30px;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        table tr:hover {
            background: #f8f9fa;
        }

        .word-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }

        .word-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .word-card p {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .word-card .label {
            font-weight: 600;
            color: #333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h2 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .badge-easy { background: #d4edda; color: #155724; }
        .badge-medium { background: #fff3cd; color: #856404; }
        .badge-hard { background: #f8d7da; color: #721c24; }
        .badge-learned { background: #cce5ff; color: #004085; }

        .quiz-container {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .quiz-word {
            font-size: 2.5em;
            color: #667eea;
            margin: 30px 0;
            font-weight: bold;
        }

        .quiz-answer {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
            min-height: 200px;
            text-align: left;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .tabs {
                flex-wrap: nowrap;
            }

            .tab-content {
                padding: 15px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .quiz-word {
                font-size: 1.8em;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Vocabulary Learning App</h1>
            <p>Learn English words from movies effortlessly</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('add')">➕ Add Word</button>
            <button class="tab-btn" onclick="showTab('view')">📋 View Words</button>
            <button class="tab-btn" onclick="showTab('quiz')">🎯 Quiz Mode</button>
            <button class="tab-btn" onclick="showTab('stats')">📊 Statistics</button>
        </div>

        <div id="add-tab" class="tab-content active">
            <div id="alert-container"></div>
            
            <form id="add-word-form">
                <div class="form-group">
                    <label>Word *</label>
                    <input type="text" id="word" required placeholder="Enter the word">
                </div>

                <div class="form-group">
                    <label>Meaning *</label>
                    <textarea id="meaning" required placeholder="Enter the meaning"></textarea>
                </div>

                <div class="form-group">
                    <label>Movie Name</label>
                    <input type="text" id="movie" placeholder="Which movie did you hear this word in?">
                </div>

                <div class="form-group">
                    <label>Context / Sentence</label>
                    <textarea id="context" placeholder="Example sentence or context from the movie"></textarea>
                </div>

                <div class="form-group">
                    <label>Difficulty Level</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="difficulty" value="Easy"> Easy
                        </label>
                        <label>
                            <input type="radio" name="difficulty" value="Medium" checked> Medium
                        </label>
                        <label>
                            <input type="radio" name="difficulty" value="Hard"> Hard
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">💾 Save Word</button>
                <button type="button" class="btn btn-secondary" onclick="clearForm()">🗑️ Clear</button>
            </form>
        </div>

        <div id="view-tab" class="tab-content">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search words, meanings, or movies...">
                <button class="btn btn-primary" onclick="searchWords()">🔍 Search</button>
                <button class="btn btn-secondary" onclick="loadAllWords()">📋 Show All</button>
            </div>

            <div id="words-container" class="loading">Loading words...</div>
        </div>

        <div id="quiz-tab" class="tab-content">
            <div class="quiz-container">
                <h2>🎯 Test Your Vocabulary!</h2>
                
                <div id="quiz-content" class="hidden">
                    <div class="quiz-word" id="quiz-word"></div>
                    <div class="quiz-answer" id="quiz-answer">
                        <p>Think about the meaning...</p>
                        <p>Click "Show Answer" when ready!</p>
                    </div>
                    
                    <button class="btn btn-primary" onclick="showAnswer()">👁️ Show Answer</button>
                    <button class="btn btn-secondary" onclick="nextQuizWord()">➡️ Next Word</button>
                    <button class="btn btn-success" onclick="markAsLearned()">✅ Mark as Learned</button>
                </div>

                <button id="start-quiz-btn" class="btn btn-primary" onclick="startQuiz()">🚀 Start Quiz</button>
            </div>
        </div>

        <div id="stats-tab" class="tab-content">
            <div id="stats-container" class="loading">Loading statistics...</div>
        </div>
    </div>

    <script>
        let quizWords = [];
        let currentQuizIndex = 0;

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'view') loadAllWords();
            if (tabName === 'stats') loadStatistics();
        }

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.appendChild(alert);

            setTimeout(() => alert.remove(), 5000);
        }

        document.getElementById('add-word-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                word: document.getElementById('word').value,
                meaning: document.getElementById('meaning').value,
                movie: document.getElementById('movie').value,
                context: document.getElementById('context').value,
                difficulty: document.querySelector('input[name="difficulty"]:checked').value
            };

            try {
                const response = await fetch('/add_word', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    clearForm();
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Error adding word: ' + error.message, 'error');
            }
        });

        function clearForm() {
            document.getElementById('add-word-form').reset();
        }

        async function loadAllWords() {
            const container = document.getElementById('words-container');
            container.innerHTML = '<div class="loading">Loading words...</div>';

            try {
                const response = await fetch('/get_words');
                const result = await response.json();

                if (result.success) {
                    displayWords(result.words);
                } else {
                    container.innerHTML = '<p>Error loading words</p>';
                }
            } catch (error) {
                container.innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        }

        async function searchWords() {
            const searchTerm = document.getElementById('search-input').value;
            const container = document.getElementById('words-container');
            container.innerHTML = '<div class="loading">Searching...</div>';

            try {
                const response = await fetch('/get_words?search=' + encodeURIComponent(searchTerm));
                const result = await response.json();

                if (result.success) {
                    displayWords(result.words);
                } else {
                    container.innerHTML = '<p>Error searching words</p>';
                }
            } catch (error) {
                container.innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        }

        function displayWords(words) {
            const container = document.getElementById('words-container');

            if (words.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 40px;">No words found. Add some words to get started!</p>';
                return;
            }

            let html = '<div class="table-container"><table><thead><tr>';
            html += '<th>Word</th><th>Meaning</th><th>Movie</th><th>Difficulty</th><th>Reviews</th><th>Status</th><th>Date</th><th>Action</th>';
            html += '</tr></thead><tbody>';

            words.forEach(word => {
                const difficultyBadge = `badge-${word.difficulty.toLowerCase()}`;
                const statusBadge = word.learned ? '<span class="badge badge-learned">Learned</span>' : '';
                
                html += `<tr>
                    <td><strong>${word.word}</strong></td>
                    <td>${word.meaning.substring(0, 100)}${word.meaning.length > 100 ? '...' : ''}</td>
                    <td>${word.movie}</td>
                    <td><span class="badge ${difficultyBadge}">${word.difficulty}</span></td>
                    <td>${word.review_count}</td>
                    <td>${statusBadge}</td>
                    <td>${word.date_added}</td>
                    <td>
                        <button class="btn btn-secondary" style="padding: 8px 15px; font-size: 14px;" onclick='showWordDetails(${JSON.stringify(word)})'>👁️</button>
                        <button class="btn btn-danger" style="padding: 8px 15px; font-size: 14px;" onclick="deleteWord('${word.id}')">🗑️</button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function showWordDetails(word) {
            alert(`Word: ${word.word}\nMeaning: ${word.meaning}\nMovie: ${word.movie}\nContext: ${word.context}\nDifficulty: ${word.difficulty}\nReviews: ${word.review_count}`);
        }

        async function deleteWord(wordId) {
            if (!confirm('Are you sure you want to delete this word?')) return;

            try {
                const response = await fetch(`/delete_word/${wordId}`, { method: 'DELETE' });
                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    loadAllWords();
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Error deleting word: ' + error.message, 'error');
            }
        }

        async function startQuiz() {
            try {
                const response = await fetch('/get_quiz_words');
                const result = await response.json();

                if (result.success) {
                    quizWords = result.words;
                    currentQuizIndex = 0;
                    document.getElementById('start-quiz-btn').classList.add('hidden');
                    document.getElementById('quiz-content').classList.remove('hidden');
                    nextQuizWord();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert('Error loading quiz: ' + error.message);
            }
        }

        function nextQuizWord() {
            if (currentQuizIndex >= quizWords.length) {
                alert('Quiz completed! 🎉');
                document.getElementById('quiz-content').classList.add('hidden');
                document.getElementById('start-quiz-btn').classList.remove('hidden');
                return;
            }

            const word = quizWords[currentQuizIndex];
            document.getElementById('quiz-word').textContent = word.word;
            document.getElementById('quiz-answer').innerHTML = '<p>Think about the meaning...</p><p>Click "Show Answer" when ready!</p>';
            currentQuizIndex++;
        }

        async function showAnswer() {
            if (currentQuizIndex === 0) return;

            const word = quizWords[currentQuizIndex - 1];
            let answerHTML = `<p><span class="label">Meaning:</span> ${word.meaning}</p>`;
            
            if (word.context) {
                answerHTML += `<p><span class="label">Context:</span> ${word.context}</p>`;
            }
            
            if (word.movie) {
                answerHTML += `<p><span class="label">Movie:</span> ${word.movie}</p>`;
            }

            document.getElementById('quiz-answer').innerHTML = answerHTML;

            await fetch(`/increment_review/${word.id}`, { method: 'POST' });
        }

        async function markAsLearned() {
            if (currentQuizIndex === 0) return;

            const word = quizWords[currentQuizIndex - 1];
            
            try {
                const response = await fetch(`/mark_learned/${word.id}`, { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    alert(`✅ "${word.word}" marked as learned!`);
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function loadStatistics() {
            const container = document.getElementById('stats-container');
            container.innerHTML = '<div class="loading">Loading statistics...</div>';

            try {
                const response = await fetch('/get_statistics');
                const result = await response.json();

                if (result.success) {
                    displayStatistics(result.stats);
                } else {
                    container.innerHTML = '<p>Error loading statistics</p>';
                }
            } catch (error) {
                container.innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        }

        function displayStatistics(stats) {
            const container = document.getElementById('stats-container');

            let html = '<div class="stats-grid">';
            html += `<div class="stat-card"><h2>${stats.total_words}</h2><p>Total Words</p></div>`;
            html += `<div class="stat-card"><h2>${stats.learned_words}</h2><p>Learned Words</p></div>`;
            html += `<div class="stat-card"><h2>${stats.in_progress}</h2><p>In Progress</p></div>`;
            html += `<div class="stat-card"><h2>${stats.progress_percent}%</h2><p>Progress</p></div>`;
            html += '</div>';

            html += '<div class="word-card">';
            html += '<h3>📊 By Difficulty</h3>';
            html += `<p><span class="badge badge-easy">Easy: ${stats.easy}</span> `;
            html += `<span class="badge badge-medium">Medium: ${stats.medium}</span> `;
            html += `<span class="badge badge-hard">Hard: ${stats.hard}</span></p>`;
            html += '</div>';

            if (stats.most_reviewed.length > 0) {
                html += '<div class="word-card">';
                html += '<h3>⭐ Most Reviewed Words</h3>';
                stats.most_reviewed.forEach((word, index) => {
                    html += `<p>${index + 1}. <strong>${word.word}</strong> - ${word.review_count} reviews</p>`;
                });
                html += '</div>';
            }

            if (stats.movies.length > 0) {
                html += '<div class="word-card">';
                html += '<h3>🎬 Words by Movie</h3>';
                stats.movies.forEach(([movie, count]) => {
                    html += `<p><strong>${movie}</strong>: ${count} words</p>`;
                });
                html += '</div>';
            }

            container.innerHTML = html;
        }

        window.onload = function() {
            loadAllWords();
        };
    </script>
</body>
</html>
