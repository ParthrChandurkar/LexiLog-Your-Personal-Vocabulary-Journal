  <text class="card-sub-sm" x="750" y="302">random practice</text>

  <rect x="506" y="346" width="168" height="72" rx="2" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
  <path class="icon" d="M524 392 V360 M524 392 H564"/>
  <path class="icon" d="M532 382 L544 371 L554 376 L566 360"/>
