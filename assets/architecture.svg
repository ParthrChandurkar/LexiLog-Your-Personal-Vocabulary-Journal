  <rect class="icon" x="108" y="622" width="46" height="32"/>
  <path class="icon" d="M108 632 H154"/>
  <text class="card-title" x="178" y="628">web_app.html</text>
  <text class="card-sub" x="178" y="648">static UI prototype</text>

