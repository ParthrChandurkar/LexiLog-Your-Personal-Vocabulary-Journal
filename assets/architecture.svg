  <path class="icon" d="M410 637 H456"/>
  <path class="icon" d="M433 614 V660"/>
  <text class="card-title" x="478" y="628">REST routes</text>
  <text class="card-sub" x="478" y="648">not implemented</text>

  <rect x="692" y="602" width="238" height="70" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <path class="icon" d="M716 623 H758 V655 H716 Z M723 630 H751 M723 642 H744"/>
  <text class="card-title" x="782" y="628">Browser UX</text>
  <text class="card-sub" x="782" y="648">desktop-like tabs</text>

  <rect x="996" y="602" width="190" height="70" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <path class="icon" d="M1016 636 H1048 M1032 620 V652"/>
