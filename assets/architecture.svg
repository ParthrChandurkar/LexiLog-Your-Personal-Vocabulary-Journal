  <text class="card-sub" x="1052" y="305">word, meaning, context</text>
  <text class="card-sub" x="1052" y="324">difficulty, reviews, learned</text>

  <rect x="964" y="390" width="224" height="72" rx="2" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <path class="icon" d="M984 407 H1022 L1034 419 V445 H984 Z"/>
  <path class="icon" d="M1022 407 V419 H1034"/>
