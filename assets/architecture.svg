  <text class="card-sub" x="1052" y="438">Vocabulary collection</text>

  <path class="arrow" d="M862 163 H956"/>
  <path class="arrow" d="M862 382 H942 V426 H956"/>
  <path class="arrow" d="M1076 212 V250"/>

