<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LexiLog Vocabulary Journal Architecture</title>
  <desc id="desc">Architecture diagram for the LexiLog desktop vocabulary journal showing launcher, Tkinter UI, application core, MongoDB storage, PDF export, and the optional web template prototype.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#232323"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2d6cdf"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .zone { fill: #ffffff; stroke: #3f83f8; stroke-width: 2; stroke-dasharray: 7 7; }
      .zone-title { fill: #000000; font: 700 18px Arial, Helvetica, sans-serif; }
      .card-title { fill: #000000; font: 700 15px Arial, Helvetica, sans-serif; }
      .card-sub { fill: #000000; font: 12px Arial, Helvetica, sans-serif; }
      .card-title-sm { fill: #000000; font: 700 14px Arial, Helvetica, sans-serif; }
      .card-sub-sm { fill: #000000; font: 11px Arial, Helvetica, sans-serif; }
      .small { fill: #000000; font: 11px Arial, Helvetica, sans-serif; }
      .arrow { stroke: #232323; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-soft { stroke: #2d6cdf; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow-blue); }
      .icon { stroke: #232323; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="canvas" x="1" y="1" width="1278" height="758"/>
  <text x="640" y="38" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">LexiLog Personal Vocabulary Journal Architecture</text>

  <rect class="zone" x="54" y="74" width="390" height="435"/>
  <text class="zone-title" x="76" y="101">Desktop Runtime</text>

  <rect x="86" y="128" width="170" height="68" rx="2" fill="#ffffff" stroke="#0e9f6e" stroke-width="2"/>
  <path class="icon" d="M108 146 H132 L144 158 V181 H108 Z"/>
  <path class="icon" d="M132 146 V158 H144"/>
  <text class="card-title" x="165" y="156">VocabApp.bat</text>
  <text class="card-sub" x="165" y="176">launch helper</text>

  <rect x="86" y="232" width="170" height="68" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle class="icon" cx="126" cy="266" r="18"/>
  <path class="icon" d="M126 252 V280 M112 266 H140"/>
  <text class="card-title" x="165" y="260">app.py</text>
  <text class="card-sub" x="165" y="280">Tkinter entry point</text>

