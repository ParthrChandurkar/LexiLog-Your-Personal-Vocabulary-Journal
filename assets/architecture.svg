  <text class="card-sub" x="196" y="407">Add, view/search, quiz, stats</text>
  <text class="card-sub" x="196" y="426">and PDF export tabs</text>

  <path class="arrow" d="M171 196 V224"/>
  <path class="arrow" d="M171 300 V342"/>

