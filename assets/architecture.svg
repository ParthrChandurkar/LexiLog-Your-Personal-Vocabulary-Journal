  <text class="card-title-sm" x="578" y="391">and Stats</text>
  <text class="card-sub-sm" x="578" y="408">filters, counts</text>

  <rect x="694" y="346" width="168" height="72" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <path class="icon" d="M716 360 H754 V396 H716 Z"/>
  <path class="icon" d="M724 372 H746 M724 384 H746"/>
  <text class="card-title-sm" x="768" y="375">PDF Export</text>
  <text class="card-sub-sm" x="768" y="394">ReportLab file</text>

